<style>
  .demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  .demo-card { border-radius: 14px; overflow: hidden; background: #060606; position: relative; height: 260px; }

  /* A: 星座连线 */
  .constellation { position: absolute; inset: 0; }
  .constellation .star { position: absolute; width: 3px; height: 3px; background: rgba(212,165,116,0.8); border-radius: 50%; box-shadow: 0 0 6px rgba(212,165,116,0.4); animation: twinkle 3s ease-in-out infinite; }
  .constellation .star:nth-child(2) { animation-delay: 0.5s; }
  .constellation .star:nth-child(3) { animation-delay: 1s; }
  .constellation .star:nth-child(4) { animation-delay: 1.5s; }
  .constellation .star:nth-child(5) { animation-delay: 2s; }
  .constellation .star:nth-child(6) { animation-delay: 0.8s; }
  .constellation .star:nth-child(7) { animation-delay: 1.3s; }
  .constellation .star:nth-child(8) { animation-delay: 0.3s; }
  .constellation svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .constellation svg line { stroke: rgba(212,165,116,0.15); stroke-width: 1; stroke-dasharray: 4 4; animation: dash-flow 4s linear infinite; }
  @keyframes twinkle { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
  @keyframes dash-flow { to { stroke-dashoffset: -16; } }

  /* B: 墨迹晕染 */
  .ink-wash { position: absolute; inset: 0; }
  .ink-wash .blob { position: absolute; border-radius: 50%; filter: blur(40px); animation: ink-breathe 8s ease-in-out infinite; }
  .ink-wash .blob:nth-child(1) { width: 200px; height: 200px; top: 10%; left: 15%; background: rgba(212,165,116,0.06); animation-delay: 0s; }
  .ink-wash .blob:nth-child(2) { width: 160px; height: 160px; top: 40%; right: 10%; background: rgba(180,140,100,0.05); animation-delay: 2s; }
  .ink-wash .blob:nth-child(3) { width: 180px; height: 180px; bottom: 10%; left: 40%; background: rgba(200,160,120,0.04); animation-delay: 4s; }
  .ink-wash .stroke { position: absolute; top: 30%; left: 10%; width: 80%; height: 2px; background: linear-gradient(90deg, transparent, rgba(212,165,116,0.12), transparent); animation: stroke-fade 6s ease-in-out infinite; }
  @keyframes ink-breathe { 0%,100% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.15); opacity: 1; } }
  @keyframes stroke-fade { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }

  /* C: 等高线地形 */
  .topo { position: absolute; inset: 0; }
  .topo .contour { position: absolute; border: 1px solid rgba(212,165,116,0.06); border-radius: 50%; animation: topo-drift 20s linear infinite; }
  .topo .contour:nth-child(1) { width: 300px; height: 200px; top: -20px; left: -40px; }
  .topo .contour:nth-child(2) { width: 250px; height: 160px; top: 30px; left: 0px; animation-delay: -3s; }
  .topo .contour:nth-child(3) { width: 200px; height: 130px; top: 70px; left: 30px; animation-delay: -6s; }
  .topo .contour:nth-child(4) { width: 150px; height: 100px; top: 110px; left: 60px; animation-delay: -9s; }
  .topo .contour:nth-child(5) { width: 350px; height: 180px; top: 40px; right: -60px; animation-delay: -2s; }
  .topo .contour:nth-child(6) { width: 280px; height: 150px; top: 80px; right: -30px; animation-delay: -5s; }
  @keyframes topo-drift { 0% { transform: translateY(0); opacity: 0.5; } 50% { opacity: 1; } 100% { transform: translateY(-20px); opacity: 0.5; } }

  /* D: 打字机字符雨 */
  .char-rain { position: absolute; inset: 0; overflow: hidden; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(212,165,116,0.15); }
  .char-rain .col { position: absolute; top: -20%; writing-mode: vertical-rl; animation: rain-fall linear infinite; }
  @keyframes rain-fall { 0% { transform: translateY(-100%); } 100% { transform: translateY(300%); } }
</style>
